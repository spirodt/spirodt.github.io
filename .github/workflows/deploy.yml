# Автоматско објавување на GitHub Pages при секој push на main,
# и секој ден во 06:00 (Скопје) за да се појават новите BSSR инсталации на /download.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 06:00 во Скопје (лето)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Refresh BSSR installers list
        # Ако bssr.mk не одговори, чекорот не ја руши изградбата — останува последниот список.
        continue-on-error: true
        run: python3 .github/scripts/update_bssr_releases.py src/SpiroPortfolio/wwwroot/data/bssr-releases.json 5

      - name: Publish
        run: dotnet publish src/SpiroPortfolio/SpiroPortfolio.csproj -c Release -o out

      - name: Fix base href for project pages
        # Репо <user>.github.io (пр. spirodt.github.io) се служи од корен „/“ — тогаш не се менува ништо.
        # Секое друго репо се служи од „/<репо>/“. Со сопствен домен, избриши го овој чекор.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${REPO,,}" != "${OWNER}.github.io" ]; then
            sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" out/wwwroot/index.html
          fi

      - name: Share previews (Facebook / LinkedIn) per page
        # Адреса на страната: repo variable SITE_URL (пр. https://bss.bssr.mk/) или автоматски од GitHub.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -z "$SITE_URL" ]; then
            if [ "${REPO,,}" = "${OWNER}.github.io" ]; then SITE_URL="https://${OWNER}.github.io/"; else SITE_URL="https://${OWNER}.github.io/${REPO}/"; fi
          fi
          python3 .github/scripts/make_static_pages.py out/wwwroot "$SITE_URL"

      - name: SPA fallback + disable Jekyll
        run: |
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
