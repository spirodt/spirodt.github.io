# Автоматско објавување на GitHub Pages при секој push на main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/SpiroPortfolio/SpiroPortfolio.csproj -c Release -o out

      - name: Fix base href for project pages
        # Репо <user>.github.io (пр. spirodt.github.io) се служи од корен „/“ — тогаш не се менува ништо.
        # Секое друго репо се служи од „/<репо>/“. Со сопствен домен, избриши го овој чекор.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${REPO,,}" != "${OWNER}.github.io" ]; then
            sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" out/wwwroot/index.html
          fi

      - name: SPA fallback + disable Jekyll
        run: |
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
