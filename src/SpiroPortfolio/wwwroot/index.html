    <!-- Тема пред првото цртање (без бел „блесок“ во темен режим) -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) { }
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = t;
        })();

        // Од каде дојде посетителот: ?ref=код (препорака), utm_* (кампања/мрежа) или друга страна (referrer).
        // Се чува САМО во прелистувачот на посетителот и се праќа заедно со пораката од контакт формата.
        (function () {
            try {
                var p = new URLSearchParams(location.search);
                var ref = (p.get('ref') || '').replace(/[^a-z0-9\-]/gi, '').slice(0, 40) || null;
                var src = p.get('utm_source'), med = p.get('utm_medium'), camp = p.get('utm_campaign');
                var host = null;
                try { if (document.referrer) { var u = new URL(document.referrer); if (u.host !== location.host) host = u.host; } } catch (e) { }
                var touch = {
                    ref: ref, source: src || host || 'direct', medium: med || (host ? 'referral' : null),
                    campaign: camp || null, referrer: host, landing: location.pathname, at: new Date().toISOString()
                };
                if (!localStorage.getItem('bss_first_touch')) localStorage.setItem('bss_first_touch', JSON.stringify(touch));
                if (ref || src || host) localStorage.setItem('bss_last_touch', JSON.stringify(touch));
                if (ref && !localStorage.getItem('bss_referred_by')) localStorage.setItem('bss_referred_by', ref);
                localStorage.setItem('bss_visits', String((+localStorage.getItem('bss_visits') || 0) + 1));
                // Тргни ги параметрите од адресата, за посетителот да не го препрати туѓиот код.
                if (ref || src || med || camp) {
                    ['ref', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'fbclid'].forEach(function (k) { p.delete(k); });
                    var q = p.toString();
                    history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
                }
            } catch (e) { }
        })();
    </script>
